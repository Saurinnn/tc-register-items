services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-dev
    ports:
      - "3000:3000"
    volumes:
      # ソースコードをマウント（ホットリロード対応）
      - ./app:/app
      # node_modules はコンテナ側を使用（パフォーマンス向上）
      - nextjs_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # WSL/Docker でのホットリロードに必要
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  nextjs_node_modules:
